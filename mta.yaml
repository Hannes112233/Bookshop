_schema-version: 3.3.0
ID: Bookshop
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Bookshop-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    requires:
      - name: Bookshop-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: Bookshop-db
      - name: Bookshop-destination
      - name: Bookshop-auth

  - name: Bookshop-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Bookshop-db

  - name: Bookshop-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Bookshopadminauthors
          artifacts:
            - admin-authors.zip
          target-path: app/
        - name: Bookshopadminbooks
          artifacts:
            - admin-books.zip
          target-path: app/
        - name: Bookshopbrowse
          artifacts:
            - browse.zip
          target-path: app/
        - name: Bookshopgenres
          artifacts:
            - genres.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: Bookshop-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
            IASDependencyName: Bookshop-ias-api
      - name: Bookshop-auth
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true
            IASDependencyName: Bookshop-ias-api

  - name: Bookshopadminauthors
    type: html5
    path: app/admin-authors
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Bookshopadminbooks
    type: html5
    path: app/admin-books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Bookshopbrowse
    type: html5
    path: app/browse
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Bookshopgenres
    type: html5
    path: app/genres
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: Bookshop-destinations
    type: com.sap.application.content
    requires:
      - name: Bookshop-html5-repo-host
        parameters:
          service-key:
            name: Bookshop-html5-repo-host-key
      - name: srv-api
      - name: Bookshop-destination
        parameters:
          content-target: true
      - name: Bookshop-auth
        parameters:
          service-key:
            name: Bookshop-auth-key
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: Bookshop-html5-repository
              ServiceInstanceName: Bookshop-html5-repo-host
              ServiceKeyName: Bookshop-html5-repo-host-key
              sap.cloud.service: Bookshop.service
            - Name: Bookshop-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Bookshop-auth
              ServiceKeyName: Bookshop-auth-key
              sap.cloud.service: Bookshop.service

resources:
  - name: Bookshop-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: Bookshop-ias
      service-plan: application
      config:
        provided-apis:
          - name: Bookshop-ias-api
            description: API exposed by the application
        display-name: Bookshop
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
        xsuaa-cross-consumption: true
  - name: Bookshop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: Bookshop-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: Bookshop-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: Bookshop-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Bookshop-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'admin (Bookshop ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
